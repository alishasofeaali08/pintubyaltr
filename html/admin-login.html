<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINTU Admin Login</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body>
<div class="admin-container">
    <div class="admin-login-box">
        <h1>🔐 Admin Portal</h1>
        <h2>PINTU Administration Access</h2>
        <form id="adminLoginForm">
            <label for="adminUsername">👤</label>
            <input required type="text" name="username" id="adminUsername" placeholder="Admin Username"><br>
            <label for="adminPassword">🔒</label>
            <input required type="password" name="password" id="adminPassword" placeholder="Admin Password"><br>
            <button type="submit">Admin Login</button>
        </form>
        <p><a href="login.html">← Back to User Login</a></p>
    </div>
</div>
<script src="../js/storage.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
