<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINTU Login</title>
    <link rel ="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../images/logo.png">

</head>
<body>
<div class="container">
    <h1>Welcome to Pintu!</h1>
    <h2>The Gateway to Better Property Living.</h2>
    <form id="loginForm">
        <label for="loginUsername">👤</label>
        <input required type="text" name="username" id="loginUsername" placeholder="Username"><br>
        <label for="loginPassword">🔒</label>
        <input required type="password" name="password" id="loginPassword" placeholder="Password"><br>
        <button type="submit">Log In</button>
    </form>
    <p>Don't have an account?! Register via <a href="signup.html">click here</a> </p>
</div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
