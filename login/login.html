<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintu signup</title>
    <link rel ="stylesheet" href="login-style.css">
</head>
<body>
<div class="container">
    <h1>Welcome to Pintu!</h1>
    <h2>The Gateway to Better Property Living.</h2>
    <form>
        <label for="username-input">👤</label>
        <input required type="text" name="username" id="username-input" placeholder="Username"><br>
        <label for="password-input">🔒</label>
        <input required type="password" name="password" id="password-input" placeholder="Password"><br>
        <button type="submit">Log In</button>
    </form>
    <p>Don't have an account?! Register via <a href="../signup/signup.html">click here</a> </p>
</div>
<script src="login.js"></script>
</body>
</html>
