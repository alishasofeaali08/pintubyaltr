# Render blueprint: build the React app and run the Express API on one Node service.
# Set MONGODB_URI to a MongoDB Atlas connection string in the Render dashboard.
services:
  - type: web
    name: pintu
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
