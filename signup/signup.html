<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintu signup</title>
    <link rel ="stylesheet" href="signup-style.css">
</head>
<body>
     <div class="container">
         <h1>Welcome to Pintu!</h1>
         <h2>The Gateway to Better Property Living.</h2>
         <form>
             <label for="username-input">👤</label>
             <input required type="text" name="username" id="username-input" placeholder="username"><br>
             <label for="email-input">📧</label>
             <input required type="text" name="email" id="email-input" placeholder="Email"><br>
             <label for="phone-number-input">📞</label>
             <input required type="text" name="phone-number" id="phone-number-input" placeholder="Phone Number"><br>
             <label for="password-input">🔒</label>
             <input required type="text" name="password" id="password-input" placeholder="Password"><br>
             <label for="repeat-password-input">🔒</label>
             <input required type="text" name="repeat-password" id="repeat-password-input" placeholder="Repeat Password"><br>
             <label for="IC-input">🆔</label>
             <input required type="text" name="IC" id="IC-input" placeholder="eg: 000000-00-0000"><br>
            <button type="submit">Sign Up</button>
         </form>
         <p>Already have an account?! Log in <a href="../login/login.html">click here</a> </p>
     </div>
     <script src="signup.js"></script>
</body>
</html>
